# Publishing a GitHub release tagged vX.Y.Z builds the module and attaches module.json and
# module.zip to it. The version and download URL in module.json are set from the tag, so the
# manifest URL (releases/latest/download/module.json) always points at the newest release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set version and download URL from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $d' public/module.json > module.tmp
          mv module.tmp public/module.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Package
        run: |
          cd dist
          zip -r ../module.zip .
          cp module.json ../module.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
